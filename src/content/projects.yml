- id: merger
  title: Merger
  subtitle: An application to automate CI/CD pipelines for PR's via Github Actions
  description: At Pitch, we replaced Mergify with an in-house tool which I built. The tool connected the Github API, our CI provider (CircleCI) and Github Actions API, to orchestrate the merging of PRs in our repo. The system was designed to automatically merge the main branch into a PR, once all merge conditions had been met, run the CI pipeline, and if it succeeded, to merge the PR. It used the Github Actions API to trigger workflows based on actions on the PR.
- id: demo
  title: Demo page
  subtitle: A dynamic React form for receiving demo request submissions.
  description: Implements debounced validation (for a smooth UX), mobile-first rendering, and proxies submissions through the backend, to enforce validation, before finally sending the submission to Customer.io for handling.
  img: ../assets/demo-form.png
  url: https://pitch.com/demo
- id: portfolio
  title: Portfolio
  subtitle: This portfolio website
  description: |
    This website is itself an example of my work. It's built with Astro and is a static site. Each project is defined as an entry in a YAML file and each entry gets rendered dynamically as its own page, making adding more projects a breeze.

    This site is responsive and mobile-first, fonts are self-hosted through Astro's font pipeline, and images are automatically converted to WebP at build time (the demo screenshot, for example, drops from ~350kB to ~50kB).

    Every push to main kicks off a GitHub Actions workflow that builds the site and deploys it to GitHub Pages. The full source is on GitHub — feel free to dig through it.
